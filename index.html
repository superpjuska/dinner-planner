<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dinner planner</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2d6a4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dinners">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f1;--card:#fff;--ink:#1c2a23;--mute:#667269;--line:#dce4da;--acc:#2d6a4f;--acc-ink:#fff;--soft:#e2efe6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a17;--card:#1c2521;--ink:#e8efe9;--mute:#98a59c;--line:#2c3832;--acc:#6cc39a;--acc-ink:#0f1a14;--soft:#223a2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a17;--card:#1c2521;--ink:#e8efe9;--mute:#98a59c;--line:#2c3832;--acc:#6cc39a;--acc-ink:#0f1a14;--soft:#223a2e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Figtree,system-ui,-apple-system,Segoe UI,sans-serif}
#app{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
h2{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0}
h3{font-size:15px;font-weight:600;margin:18px 0 6px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.tabs button{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 16px;font-weight:600}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:22px}
.day{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;min-height:56px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.day b{font-size:14px}
.day span{font-size:18px;line-height:1.1;min-height:20px}
.day.has{background:var(--soft);border-color:transparent}
.day.has span{color:var(--ink)}
.day.sel{outline:2px solid var(--acc);outline-offset:1px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sub{color:var(--mute);font-size:14px;margin:2px 0 0}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;white-space:nowrap}
.cards{display:grid;gap:10px}
.card{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;text-align:left;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.card .em{font-size:34px;grid-row:span 2}
.card .nm{font-weight:800;font-size:17px}
.card .ing{grid-column:2/4;color:var(--mute);font-size:13px}
.card .tm{background:var(--soft);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600;white-space:nowrap}
.card.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.card.on .ing{color:inherit;opacity:.85}
.card.on .tm{background:rgba(255,255,255,.22);color:inherit}
.recipe{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:20px}
.recipe .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.recipe ul,.recipe ol{margin:0;padding-left:22px}
.recipe li{margin:4px 0}
.recipe ol li::marker{font-weight:800;color:var(--acc)}
.cols{display:grid;gap:4px 28px}
@media(min-width:620px){.cols{grid-template-columns:1fr 1.4fr}}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:12px;font-weight:600}
summary::-webkit-details-marker{display:none}
summary .tm{margin-left:auto;color:var(--mute);font-size:14px;font-weight:400}
details .recipe{border:0;margin:0;padding:0 16px 16px;border-top:1px solid var(--line);border-radius:0}
.empty{color:var(--mute);margin-top:20px}
.week{gap:4px}
.wh{text-align:center;font-size:12px;font-weight:600;color:var(--mute)}
.day.today{border-color:var(--acc)}
.day.today b{color:var(--acc)}
.other{display:grid;gap:6px;margin-top:14px;font-weight:600;font-size:14px}
.other select{font:inherit;font-weight:400;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.other select:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.mnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mnav h2{flex:1;font-size:20px}
.mnav .ghost{padding:6px 12px}
.form{display:grid;gap:12px;margin-top:14px}
.form label{display:grid;gap:4px;font-weight:600;font-size:14px}
.form input,.form textarea{font:inherit;font-weight:400;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.form input:focus-visible,.form textarea:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.form .row{display:grid;grid-template-columns:90px 1fr;gap:12px}
.form .save{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);justify-self:start}
.err{color:#b3261e;margin:0;min-height:1.3em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ff8a80}}
:root[data-theme="dark"] .err{color:#ff8a80}
.bar{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.lang{display:flex;gap:4px;padding-top:6px}
.lang button{border:1px solid var(--line);background:none;border-radius:8px;padding:5px 10px;font-weight:600;font-size:13px}
.lang button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.shop-action{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.shopping{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 20px}
.shopping h2{font-size:20px}
.shopping h3{margin-top:14px}
.shopping ul{list-style:none;margin:0;padding:0}
.shopping li{margin:6px 0}
.shopping label{display:flex;align-items:flex-start;gap:8px}
.shopping input{margin-top:6px;accent-color:var(--acc)}
.shop-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 16px}
.shop-form label{display:grid;gap:4px;font-weight:600;font-size:14px}
.shop-form input{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.shop-form button{align-self:end;justify-self:start}
.shop-date{display:flex;gap:6px}
.shop-date input{min-width:0}
.shop-date .ghost{padding:6px 10px}
.date-picker{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:6px}
.date-picker-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.date-picker-head strong{flex:1;text-align:center}
.date-picker-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.date-picker-grid span{text-align:center;font-size:12px;font-weight:600;color:var(--mute);padding:4px 0}
.date-picker-grid button{border:0;background:none;border-radius:8px;padding:7px 2px}
.date-picker-grid button:hover,.date-picker-grid button.sel{background:var(--soft)}
.date-picker-grid button.today{outline:1px solid var(--acc)}
.lang button.sync{padding:5px 8px}.lang button.sync.off{opacity:.55}
.shopping li.shop-edit{display:flex;gap:8px;margin:6px 0;list-style:none}.shopping li.shop-edit{align-items:center}.shopping li.shop-edit input:not([type=checkbox]){flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid rgba(128,128,128,.5);border-radius:8px;background:transparent;color:inherit}
.shop-ask{margin-top:18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}.shop-ask p{margin:0 0 10px}.arch li.done{text-decoration:line-through;opacity:.65}
.combo-box{position:relative;flex:1;display:flex;gap:6px;min-width:0}.combo-list{position:absolute;left:0;right:0;top:100%;z-index:5;max-height:220px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;margin-top:4px;box-shadow:0 6px 20px rgba(0,0,0,.18)}.combo-list[hidden],.combo-list button[hidden]{display:none}.combo-list button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;font:inherit;color:inherit}.combo-list button:hover{background:rgba(128,128,128,.15)}
.item-add{display:flex;gap:8px;margin:12px 0}.item-add input{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid rgba(128,128,128,.5);border-radius:8px;background:transparent;color:inherit}
ul.items{list-style:none;padding:0;margin:0}ul.items li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line)}ul.items li[hidden]{display:none}ul.items li small{opacity:.6}
dialog.qty{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--bg);color:var(--ink);width:min(340px,90vw);box-sizing:border-box}dialog.qty::backdrop{background:rgba(0,0,0,.4)}dialog.qty h3{margin:0 0 2px;font-size:15px;opacity:.7}dialog.qty .qn{margin:0 0 12px;font-size:20px;font-weight:700}dialog.qty input{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border:1px solid rgba(128,128,128,.5);border-radius:8px;background:transparent;color:inherit}dialog.qty .qb{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}dialog.qty .qok{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.off-row{display:flex;gap:8px;align-items:center;margin:8px 0}.off-row input,.off-row select{font:inherit;min-width:0}.off-row input{flex:1}
.off-list{list-style:none;margin:12px 0;padding:0}.off-list li{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0}
.off-list img{width:44px;height:44px;object-fit:contain;border-radius:6px;flex:none}.off-list .nm{flex:1;min-width:0}.off-list small{display:block;opacity:.7}.off-list b{white-space:nowrap}.off-was{text-decoration:line-through;opacity:.6;font-weight:400;margin-left:6px}
</style>
</head>

const UNITW=/^(?:g|grams?|kg|ml|dl|l|liters?|milliliters?|tbsp|tablespoons?|ss|tsp|teaspoons?|ts|cans?|boks|bokser|pack|packet|pose|pakke|cloves?|fedd|handful|neve|slices?|skiver)\b\.?\s*/i;
function ingName(raw){

async function sNow(){

  if(SY.busy){SY.again=true;return}

    await sFlush();
    const r=await sF("");
    if(!r.ok)throw 0;

    if(!SY.q.length)sApply(d); /* never overwrite changes that have not been sent yet */

function offRow(p,i){
  const o=S.off,c=offPr(p),w=offWas(p),u=offUp(p),ul=offUl(p),dn=o.done.has(i);
  return `<li>${p.image?`<img src="${offQa(p.image)}" alt="" loading="lazy">`:""}<div class="nm">${shopEsc(p.name)}<small>${shopEsc(offStore(p))}${u?" · "+offFmt(u)+(ul?"/"+ul:""):""}</small></div><b>${offFmt(c)}${w?`<span class="off-was">${offFmt(w)}</span>`:""}</b><button class="ghost" data-off-add="${i}"${dn?" disabled":""}>${dn?"✓":U().offAdd}</button></li>`;
}
function offersTab(){
  const u=U(),o=S.off;
  let h=`<h2>${u.offTab}</h2><p class="sub">${u.offSub}</p>`;
  if(!OF.key||o.cfg)return h+`<div class="form"><label>${u.offKeyL}<input id="off-key" type="password" autocomplete="off" value="${offQa(OF.key)}"></label><p class="sub">${u.offKeyHelp}</p><label>${u.offProxyL}<input id="off-proxy" inputmode="url" autocomplete="off" placeholder="https://kassal-proxy.yourname.workers.dev" value="${offQa(OF.base===OFD?"":OF.base)}"></label><p class="sub">${u.offProxyHelp}</p><button class="ghost save" data-off-key>${u.offSave}</button></div>`;
  let rows=o.res||[];
  const stores=[...new Set(rows.map(offStore).filter(Boolean))].sort();
  if(o.store)rows=rows.filter(p=>offStore(p)===o.store);
  if(o.sort==="price")rows=[...rows].sort((a,b)=>(offPr(a)??1e9)-(offPr(b)??1e9));
  else if(o.sort==="unit")rows=[...rows].sort((a,b)=>(offUp(a)??1e9)-(offUp(b)??1e9));
  o.shown=rows;
  h+=`<div class="off-row"><input id="off-q" placeholder="${offQa(u.offPh)}" value="${offQa(o.q)}" autocomplete="off" enterkeyhint="search"><button class="ghost" data-off-search>${u.offSearch}</button></div>`;
  if(o.res)h+=`<div class="off-row"><select id="off-store"><option value="">${u.offAll}</option>${stores.map(s=>`<option${s===o.store?" selected":""}>${shopEsc(s)}</option>`).join("")}</select><select id="off-sort"><option value="rel"${o.sort==="rel"?" selected":""}>${u.offSortRel}</option><option value="price"${o.sort==="price"?" selected":""}>${u.offSortPrice}</option><option value="unit"${o.sort==="unit"?" selected":""}>${u.offSortUnit}</option></select></div>`;
  if(o.err)h+=`<p class="err" role="alert">${o.err}</p>`;
  if(o.busy)h+=`<p class="empty">${u.offLoading}</p>`;
  else if(o.res)h+=rows.length?`<ul class="off-list">${rows.map(offRow).join("")}</ul>`:`<p class="empty">${u.offNone}</p>`;
  h+=`<h3>${u.offListTitle}</h3><p class="sub">${u.offListSub}</p><button class="ghost" data-off-list${o.listBusy?" disabled":""}>${o.listBusy?u.offLoading:u.offListBtn}</button>`;
  if(o.list)h+=`<ul class="off-list">${o.list.map(x=>x.p?`<li><div class="nm">${shopEsc(x.n.charAt(0).toUpperCase()+x.n.slice(1))}<small>${shopEsc(x.p.name)} · ${shopEsc(offStore(x.p))}</small></div><b>${offFmt(offPr(x.p))}</b></li>`:`<li><div class="nm">${shopEsc(x.n.charAt(0).toUpperCase()+x.n.slice(1))}<small>${u.offNoHit}</small></div></li>`).join("")}</ul>`;
  return h+`<p><button class="ghost" data-off-clear>${u.offChange}</button></p>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const a=n=>b.hasAttribute("data-off-"+n),o=S.off;
  if(a("search"))offSearch();
  else if(a("list"))offList();
  else if(a("key")){
    const v=(document.getElementById("off-key")||{value:""}).value.trim();let px=(document.getElementById("off-proxy")||{value:""}).value.trim().replace(/\/+$/,"");
    if(px&&!/^https?:\/\//i.test(px))px="https://"+px;
    if(v)OF.key=v;OF.base=px||OFD;saveOF();o.cfg=!OF.key;o.res=null;o.list=null;o.err="";for(const k in offCache)delete offCache[k];render();
  }
  else if(a("clear")){o.cfg=true;render()}
  else if(a("add")){const i=+b.dataset.offAdd,p=o.shown[i];if(!p)return;if(shopPush(shopEsc(`${p.name} (${offStore(p)}, ${offFmt(offPr(p))})`))){o.done.add(i);o.err=""}else o.err=U().offNeedList;render()}
});
document.addEventListener("input",e=>{if(e.target.id==="off-q")S.off.q=e.target.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="off-q"){e.preventDefault();offSearch()}});
document.addEventListener("change",e=>{const s=e.target;if(s.id==="off-store"){S.off.store=s.value;S.off.done=new Set();render()}else if(s.id==="off-sort"){S.off.sort=s.value;S.off.done=new Set();render()}});
render();
if(FBON){
  if(!SY.code&&!SY.asked)setTimeout(()=>{SY.asked=true;saveSY();sConnect()},600);
  else sNow();
  sStream();
  setInterval(()=>{if(!document.hidden){if(!SY.es||SY.es.readyState!==1)sNow();sUi()}},30000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(!SY.es||SY.es.readyState===2)sStream();sNow()}});
  addEventListener("online",sNow);
}
</script>
<script>
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
